name: Phase 5 Go-No-Go 证据验收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-5-go-no-go
  cancel-in-progress: false

jobs:
  contract:
    name: 校验受信任分支与放行契约
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 只允许默认分支执行最终验收
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: 检出代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: 校验最终放行契约
        run: node scripts/release/validate-phase-5-go-no-go-evidence.mjs --self-test

  evidence:
    name: 验收跨职能 Go-No-Go 证据
    needs: contract
    runs-on:
      - self-hosted
      - linux
      - x64
      - phase-5-go-no-go
    timeout-minutes: 30
    environment: phase-5-go-no-go
    env:
      GO_NO_GO_EVIDENCE_PATH: /var/lib/gaoq/go-no-go/phase-5-go-no-go.json
      GO_NO_GO_EXPECTED_ENVIRONMENT: ${{ vars.GO_NO_GO_ENVIRONMENT_NAME }}
      GO_NO_GO_EXPECTED_REGION: ${{ vars.GO_NO_GO_REGION }}
      GO_NO_GO_EXPECTED_COMMIT: ${{ github.sha }}
      GO_NO_GO_EXPECTED_API_IMAGE: ${{ vars.GO_NO_GO_API_IMAGE_DIGEST }}
      GO_NO_GO_EXPECTED_WORKER_IMAGE: ${{ vars.GO_NO_GO_WORKER_IMAGE_DIGEST }}
      GO_NO_GO_EXPECTED_WEB_IMAGE: ${{ vars.GO_NO_GO_WEB_IMAGE_DIGEST }}
      GO_NO_GO_EXPECTED_WEBSITE_IMAGE: ${{ vars.GO_NO_GO_WEBSITE_IMAGE_DIGEST }}
      GO_NO_GO_EXPECTED_DEPLOYMENT_MANIFEST: ${{ vars.GO_NO_GO_DEPLOYMENT_MANIFEST_SHA256 }}
    steps:
      - name: 检出受信任代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: 验证版本绑定与跨职能放行证据
        env:
          GO_NO_GO_VERDICT_PATH: ${{ runner.temp }}/phase-5-go-no-go-verdict.json
        run: >-
          node scripts/release/validate-phase-5-go-no-go-evidence.mjs
          --enforce-environment
          "$GO_NO_GO_EVIDENCE_PATH"
          > "$GO_NO_GO_VERDICT_PATH"

      - name: 保存不触发部署的放行结论
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-5-go-no-go-verdict-${{ github.sha }}
          path: ${{ runner.temp }}/phase-5-go-no-go-verdict.json
          if-no-files-found: error
          retention-days: 30
