name: Phase 5 性能容量证据验收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-5-performance
  cancel-in-progress: false

jobs:
  contract:
    name: 校验受信任分支与性能证据契约
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 只允许默认分支执行现场验收
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: 检出代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 校验三次容量证据的失败关闭边界
        run: node scripts/performance/validate-phase-5-capacity.mjs --self-test

  evidence:
    name: 验收生产等价隔离环境的三次容量证据
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GAOQ_OIDC_POLICY: phase-5-performance
      PERFORMANCE_EVIDENCE_OIDC_AUDIENCE: ${{ vars.PERFORMANCE_EVIDENCE_OIDC_AUDIENCE }}
      PERFORMANCE_EVIDENCE_RUN_1_URL: ${{ vars.PERFORMANCE_EVIDENCE_RUN_1_URL }}
      PERFORMANCE_EVIDENCE_RUN_1_SHA256: ${{ vars.PERFORMANCE_EVIDENCE_RUN_1_SHA256 }}
      PERFORMANCE_EVIDENCE_RUN_2_URL: ${{ vars.PERFORMANCE_EVIDENCE_RUN_2_URL }}
      PERFORMANCE_EVIDENCE_RUN_2_SHA256: ${{ vars.PERFORMANCE_EVIDENCE_RUN_2_SHA256 }}
      PERFORMANCE_EVIDENCE_RUN_3_URL: ${{ vars.PERFORMANCE_EVIDENCE_RUN_3_URL }}
      PERFORMANCE_EVIDENCE_RUN_3_SHA256: ${{ vars.PERFORMANCE_EVIDENCE_RUN_3_SHA256 }}
      PERFORMANCE_EXPECTED_ENVIRONMENT: ${{ vars.PERFORMANCE_ENVIRONMENT_NAME }}
      PERFORMANCE_EXPECTED_REGION: ${{ vars.PERFORMANCE_REGION }}
      PERFORMANCE_EXPECTED_COMMIT: ${{ github.sha }}
      PERFORMANCE_EXPECTED_API_IMAGE: ${{ vars.PERFORMANCE_API_IMAGE_DIGEST }}
      PERFORMANCE_EXPECTED_WORKER_IMAGE: ${{ vars.PERFORMANCE_WORKER_IMAGE_DIGEST }}
      PERFORMANCE_EXPECTED_WEB_IMAGE: ${{ vars.PERFORMANCE_WEB_IMAGE_DIGEST }}
      PERFORMANCE_EXPECTED_WEBSITE_IMAGE: ${{ vars.PERFORMANCE_WEBSITE_IMAGE_DIGEST }}
      PERFORMANCE_EXPECTED_DEPLOYMENT_MANIFEST: ${{ vars.PERFORMANCE_DEPLOYMENT_MANIFEST_SHA256 }}
      PERFORMANCE_EXPECTED_SIGNER_KEYSET_SHA256: ${{ vars.PERFORMANCE_SIGNER_KEYSET_SHA256 }}
    steps:
      - name: 检出受信任代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 固定 Runner 临时证据路径
        shell: bash
        run: |
          {
            printf 'PERFORMANCE_EVIDENCE_RUN_1_PATH=%s\n' \
              "$RUNNER_TEMP/phase-5-performance-run-1.json"
            printf 'PERFORMANCE_EVIDENCE_RUN_2_PATH=%s\n' \
              "$RUNNER_TEMP/phase-5-performance-run-2.json"
            printf 'PERFORMANCE_EVIDENCE_RUN_3_PATH=%s\n' \
              "$RUNNER_TEMP/phase-5-performance-run-3.json"
          } >> "$GITHUB_ENV"

      - name: 通过 GitHub OIDC 拉取三份脱敏容量证据
        run: |
          node scripts/github/fetch-oidc-protected-input.mjs \
            --url "$PERFORMANCE_EVIDENCE_RUN_1_URL" \
            --audience "$PERFORMANCE_EVIDENCE_OIDC_AUDIENCE" \
            --policy "$GAOQ_OIDC_POLICY" \
            --output "$PERFORMANCE_EVIDENCE_RUN_1_PATH" \
            --sha256 "$PERFORMANCE_EVIDENCE_RUN_1_SHA256" \
            --max-bytes 262144 \
            --media-type application/json
          node scripts/github/fetch-oidc-protected-input.mjs \
            --url "$PERFORMANCE_EVIDENCE_RUN_2_URL" \
            --audience "$PERFORMANCE_EVIDENCE_OIDC_AUDIENCE" \
            --policy "$GAOQ_OIDC_POLICY" \
            --output "$PERFORMANCE_EVIDENCE_RUN_2_PATH" \
            --sha256 "$PERFORMANCE_EVIDENCE_RUN_2_SHA256" \
            --max-bytes 262144 \
            --media-type application/json
          node scripts/github/fetch-oidc-protected-input.mjs \
            --url "$PERFORMANCE_EVIDENCE_RUN_3_URL" \
            --audience "$PERFORMANCE_EVIDENCE_OIDC_AUDIENCE" \
            --policy "$GAOQ_OIDC_POLICY" \
            --output "$PERFORMANCE_EVIDENCE_RUN_3_PATH" \
            --sha256 "$PERFORMANCE_EVIDENCE_RUN_3_SHA256" \
            --max-bytes 262144 \
            --media-type application/json

      - name: 验证环境、发布候选、受信 keyset 与三次独立容量证据
        env:
          PERFORMANCE_VERDICT_PATH: ${{ runner.temp }}/phase-5-performance-verdict.json
        run: >-
          node scripts/performance/validate-phase-5-capacity.mjs
          --enforce-environment
          "$PERFORMANCE_EVIDENCE_RUN_1_PATH"
          "$PERFORMANCE_EVIDENCE_RUN_2_PATH"
          "$PERFORMANCE_EVIDENCE_RUN_3_PATH"
          > "$PERFORMANCE_VERDICT_PATH"

      - name: 保存不含业务数据的验收结论
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-5-performance-verdict-${{ github.sha }}
          path: ${{ runner.temp }}/phase-5-performance-verdict.json
          if-no-files-found: error
          retention-days: 30
