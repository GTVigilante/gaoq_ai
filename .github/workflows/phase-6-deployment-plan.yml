name: Phase 6 生产部署计划

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-6-production-deployment-plan
  cancel-in-progress: false

jobs:
  plan:
    name: 生成只读生产部署计划
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GAOQ_OIDC_POLICY: phase-6-deployment-plan
      PHASE6_DEPLOYMENT_INPUT_OIDC_AUDIENCE: ${{ vars.PHASE6_DEPLOYMENT_PLAN_INPUT_OIDC_AUDIENCE }}
      PHASE6_DEPLOYMENT_VALUES_URL: ${{ vars.PHASE6_DEPLOYMENT_VALUES_URL }}
      PHASE6_DEPLOYMENT_VALUES_SHA256: ${{ vars.PHASE6_DEPLOYMENT_VALUES_SHA256 }}
      PHASE6_DEPLOYMENT_GO_NO_GO_URL: ${{ vars.PHASE6_DEPLOYMENT_GO_NO_GO_URL }}
      PHASE6_DEPLOYMENT_GO_NO_GO_SHA256: ${{ vars.PHASE6_DEPLOYMENT_GO_NO_GO_SHA256 }}
      PHASE6_DEPLOYMENT_PLATFORM_INTAKE_URL: ${{ vars.PHASE6_DEPLOYMENT_PLATFORM_INTAKE_URL }}
      PHASE6_DEPLOYMENT_PLATFORM_INTAKE_SHA256: ${{ vars.PHASE6_DEPLOYMENT_PLATFORM_INTAKE_SHA256 }}
      PHASE6_DEPLOYMENT_PLATFORM_INTAKE_SIGNER_KEYSET_SHA256: ${{ vars.PHASE6_DEPLOYMENT_PLATFORM_INTAKE_SIGNER_KEYSET_SHA256 }}
      PHASE6_KUBERNETES_SERVER: ${{ vars.PHASE6_KUBERNETES_SERVER }}
      PHASE6_KUBERNETES_CA_BASE64: ${{ vars.PHASE6_KUBERNETES_CA_BASE64 }}
      PHASE6_KUBERNETES_CA_SHA256: ${{ vars.PHASE6_KUBERNETES_CA_SHA256 }}
      PHASE6_KUBERNETES_CREDENTIAL_URL: ${{ vars.PHASE6_KUBERNETES_CREDENTIAL_URL }}
      PHASE6_KUBERNETES_OIDC_AUDIENCE: ${{ vars.PHASE6_DEPLOYMENT_PLAN_KUBERNETES_OIDC_AUDIENCE }}
      PHASE6_DEPLOYMENT_GUARDRAILS_MANIFEST_SHA256: ${{ vars.PHASE6_DEPLOYMENT_GUARDRAILS_MANIFEST_SHA256 }}
      PHASE6_DEPLOYMENT_RELEASE_NAME: ${{ vars.PHASE6_DEPLOYMENT_RELEASE_NAME }}
      PHASE6_DEPLOYMENT_CONTROL_NAMESPACE: ${{ vars.PHASE6_DEPLOYMENT_CONTROL_NAMESPACE }}
      PHASE6_DEPLOYMENT_TARGET_NAMESPACE: ${{ vars.PHASE6_DEPLOYMENT_TARGET_NAMESPACE }}
      PHASE6_DEPLOYMENT_PLATFORM_NAMESPACE: ${{ vars.PHASE6_DEPLOYMENT_PLATFORM_NAMESPACE }}
      PHASE6_DEPLOYMENT_KUBECTL_VERSION: ${{ vars.PHASE6_DEPLOYMENT_KUBECTL_VERSION }}
      PHASE6_DEPLOYMENT_PLAN_GROUP: ${{ vars.PHASE6_DEPLOYMENT_PLAN_GROUP }}
      PHASE6_DEPLOYMENT_APPLY_GROUP: ${{ vars.PHASE6_DEPLOYMENT_APPLY_GROUP }}
      HELM_DRIVER: configmap
      PHASE6_DEPLOYMENT_EXPECTED_COMMIT: ${{ github.sha }}
      PHASE6_DEPLOYMENT_EXPECTED_API_IMAGE: ${{ vars.PHASE6_DEPLOYMENT_API_IMAGE_DIGEST }}
      PHASE6_DEPLOYMENT_EXPECTED_WORKER_IMAGE: ${{ vars.PHASE6_DEPLOYMENT_WORKER_IMAGE_DIGEST }}
      PHASE6_DEPLOYMENT_EXPECTED_WEB_IMAGE: ${{ vars.PHASE6_DEPLOYMENT_WEB_IMAGE_DIGEST }}
      PHASE6_DEPLOYMENT_EXPECTED_WEBSITE_IMAGE: ${{ vars.PHASE6_DEPLOYMENT_WEBSITE_IMAGE_DIGEST }}
      PHASE6_DEPLOYMENT_EXPECTED_MANIFEST: ${{ vars.PHASE6_DEPLOYMENT_MANIFEST_SHA256 }}
      PHASE6_DEPLOYMENT_WEBSITE_PUBLIC_CONFIG_SHA256: ${{ vars.PHASE6_DEPLOYMENT_WEBSITE_PUBLIC_CONFIG_SHA256 }}
      PHASE6_DEPLOYMENT_EXPECTED_ROLLOUT_ID: ${{ vars.PHASE6_DEPLOYMENT_ROLLOUT_ID }}
      PHASE6_DEPLOYMENT_API_CONFIG_MAP: ${{ vars.PHASE6_DEPLOYMENT_API_CONFIG_MAP }}
      PHASE6_DEPLOYMENT_API_CONFIG_SHA256: ${{ vars.PHASE6_DEPLOYMENT_API_CONFIG_SHA256 }}
      PHASE6_DEPLOYMENT_API_SECRET: ${{ vars.PHASE6_DEPLOYMENT_API_SECRET }}
      PHASE6_DEPLOYMENT_WORKER_CONFIG_MAP: ${{ vars.PHASE6_DEPLOYMENT_WORKER_CONFIG_MAP }}
      PHASE6_DEPLOYMENT_WORKER_CONFIG_SHA256: ${{ vars.PHASE6_DEPLOYMENT_WORKER_CONFIG_SHA256 }}
      PHASE6_DEPLOYMENT_WORKER_SECRET: ${{ vars.PHASE6_DEPLOYMENT_WORKER_SECRET }}
      PHASE6_DEPLOYMENT_RUNTIME_CONTRACT_SHA256: ${{ vars.PHASE6_DEPLOYMENT_RUNTIME_CONTRACT_SHA256 }}
      PHASE6_DEPLOYMENT_WEB_CONFIG_MAP: ${{ vars.PHASE6_DEPLOYMENT_WEB_CONFIG_MAP }}
      PHASE6_DEPLOYMENT_WEB_SECRET: ${{ vars.PHASE6_DEPLOYMENT_WEB_SECRET }}
      PHASE6_DEPLOYMENT_WEBSITE_CONFIG_MAP: ${{ vars.PHASE6_DEPLOYMENT_WEBSITE_CONFIG_MAP }}
      PHASE6_DEPLOYMENT_WEBSITE_SECRET: ${{ vars.PHASE6_DEPLOYMENT_WEBSITE_SECRET }}
      GO_NO_GO_EXPECTED_ENVIRONMENT: ${{ vars.PHASE6_DEPLOYMENT_GO_NO_GO_ENVIRONMENT }}
      GO_NO_GO_EXPECTED_REGION: ${{ vars.PHASE6_DEPLOYMENT_GO_NO_GO_REGION }}
      GO_NO_GO_EXPECTED_COMMIT: ${{ github.sha }}
      GO_NO_GO_EXPECTED_API_IMAGE: ${{ vars.PHASE6_DEPLOYMENT_API_IMAGE_DIGEST }}
      GO_NO_GO_EXPECTED_WORKER_IMAGE: ${{ vars.PHASE6_DEPLOYMENT_WORKER_IMAGE_DIGEST }}
      GO_NO_GO_EXPECTED_WEB_IMAGE: ${{ vars.PHASE6_DEPLOYMENT_WEB_IMAGE_DIGEST }}
      GO_NO_GO_EXPECTED_WEBSITE_IMAGE: ${{ vars.PHASE6_DEPLOYMENT_WEBSITE_IMAGE_DIGEST }}
      GO_NO_GO_EXPECTED_DEPLOYMENT_MANIFEST: ${{ vars.PHASE6_DEPLOYMENT_MANIFEST_SHA256 }}
      GO_NO_GO_EXPECTED_SIGNER_KEYSET: ${{ vars.PHASE6_DEPLOYMENT_GO_NO_GO_SIGNER_KEYSET_SHA256 }}
      GO_NO_GO_EXPECTED_PAYROLL_RESOURCE: ${{ vars.GO_NO_GO_PAYROLL_RESOURCE }}
      GO_NO_GO_EXPECTED_PAYROLL_AUTHORIZATION_SERVER: ${{ vars.GO_NO_GO_PAYROLL_AUTHORIZATION_SERVER }}
      GO_NO_GO_EXPECTED_PAYROLL_IMAGE: ${{ vars.GO_NO_GO_PAYROLL_IMAGE_DIGEST }}
      GO_NO_GO_EXPECTED_PAYROLL_CONTRACT_HASH: ${{ vars.GO_NO_GO_PAYROLL_CONTRACT_HASH }}
      GO_NO_GO_EXPECTED_PAYROLL_CATALOG_HASH: ${{ vars.GO_NO_GO_PAYROLL_CATALOG_HASH }}
    steps:
      - name: 只允许默认分支执行
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: 检出受信任代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装固定 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1

      - name: 执行计划与身份契约自测
        run: |
          node scripts/github/fetch-oidc-protected-input.mjs --self-test
          node scripts/github/github-oidc-kubernetes-credential.mjs --self-test
          node scripts/github/write-oidc-kubeconfig.mjs --self-test
          node scripts/release/validate-phase-6-deployment-plan.mjs --self-test
          node scripts/release/validate-phase-6-runtime-config.mjs --self-test
          node scripts/release/validate-phase-6-platform-intake.mjs --self-test
          node scripts/release/validate-phase-6-deployment-authorization.mjs --self-test

      - name: 固定 Runner 临时输入与 kubeconfig 路径
        shell: bash
        run: |
          {
            printf 'PHASE6_DEPLOYMENT_VALUES_PATH=%s\n' \
              "$RUNNER_TEMP/production-values.yaml"
            printf 'PHASE6_DEPLOYMENT_GO_NO_GO_PATH=%s\n' \
              "$RUNNER_TEMP/phase-5-go-no-go.json"
            printf 'PHASE6_DEPLOYMENT_PLATFORM_INTAKE_PATH=%s\n' \
              "$RUNNER_TEMP/phase-6-platform-intake.json"
            printf 'KUBECONFIG=%s\n' \
              "$RUNNER_TEMP/phase-6-kubeconfig.json"
          } >> "$GITHUB_ENV"

      - name: 通过 GitHub OIDC 拉取三份受保护输入
        shell: bash
        run: |
          node scripts/github/fetch-oidc-protected-input.mjs \
            --url "$PHASE6_DEPLOYMENT_VALUES_URL" \
            --audience "$PHASE6_DEPLOYMENT_INPUT_OIDC_AUDIENCE" \
            --policy "$GAOQ_OIDC_POLICY" \
            --output "$PHASE6_DEPLOYMENT_VALUES_PATH" \
            --sha256 "$PHASE6_DEPLOYMENT_VALUES_SHA256" \
            --max-bytes 1048576 \
            --media-type application/yaml
          node scripts/github/fetch-oidc-protected-input.mjs \
            --url "$PHASE6_DEPLOYMENT_GO_NO_GO_URL" \
            --audience "$PHASE6_DEPLOYMENT_INPUT_OIDC_AUDIENCE" \
            --policy "$GAOQ_OIDC_POLICY" \
            --output "$PHASE6_DEPLOYMENT_GO_NO_GO_PATH" \
            --sha256 "$PHASE6_DEPLOYMENT_GO_NO_GO_SHA256" \
            --max-bytes 1048576 \
            --media-type application/json
          node scripts/github/fetch-oidc-protected-input.mjs \
            --url "$PHASE6_DEPLOYMENT_PLATFORM_INTAKE_URL" \
            --audience "$PHASE6_DEPLOYMENT_INPUT_OIDC_AUDIENCE" \
            --policy "$GAOQ_OIDC_POLICY" \
            --output "$PHASE6_DEPLOYMENT_PLATFORM_INTAKE_PATH" \
            --sha256 "$PHASE6_DEPLOYMENT_PLATFORM_INTAKE_SHA256" \
            --max-bytes 524288 \
            --media-type application/json
          node scripts/github/write-oidc-kubeconfig.mjs --output "$KUBECONFIG"

      - name: 安装固定部署工具
        shell: bash
        run: |
          mkdir --parents "$RUNNER_TEMP/phase6-bin" "$RUNNER_TEMP/phase6-tools"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://get.helm.sh/helm-v4.2.0-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/phase6-tools/helm.tar.gz"
          echo '97dbeb971be4ac4b27e3839976d9564c0fb35c6f3b1da89dd1e292d236af4096  '"$RUNNER_TEMP"'/phase6-tools/helm.tar.gz' \
            | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/phase6-tools/helm.tar.gz" \
            --directory "$RUNNER_TEMP/phase6-tools"
          install --mode 0755 "$RUNNER_TEMP/phase6-tools/linux-amd64/helm" \
            "$RUNNER_TEMP/phase6-bin/helm"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/phase6-tools/kubeconform.tar.gz"
          echo 'c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  '"$RUNNER_TEMP"'/phase6-tools/kubeconform.tar.gz' \
            | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/phase6-tools/kubeconform.tar.gz" \
            --directory "$RUNNER_TEMP/phase6-tools" kubeconform
          install --mode 0755 "$RUNNER_TEMP/phase6-tools/kubeconform" \
            "$RUNNER_TEMP/phase6-bin/kubeconform"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://dl.k8s.io/release/v1.30.12/bin/linux/amd64/kubectl \
            --output "$RUNNER_TEMP/phase6-tools/kubectl"
          echo '261a3c4eb12e09207b9e08f0b43d547220569317ed8d7a22638572100ace5b80  '"$RUNNER_TEMP"'/phase6-tools/kubectl' \
            | sha256sum --check
          install --mode 0755 "$RUNNER_TEMP/phase6-tools/kubectl" \
            "$RUNNER_TEMP/phase6-bin/kubectl"
          echo "$RUNNER_TEMP/phase6-bin" >> "$GITHUB_PATH"

      - name: 验证隔离工具链与只读输入
        shell: bash
        run: |
          test "$(node --version)" = 'v22.23.1'
          test "$(helm version --short)" = 'v4.2.0+g0646808'
          test "$(kubeconform -v)" = 'v0.7.0'
          test -f "$PHASE6_DEPLOYMENT_VALUES_PATH"
          test ! -L "$PHASE6_DEPLOYMENT_VALUES_PATH"
          test "$(stat --format='%s' "$PHASE6_DEPLOYMENT_VALUES_PATH")" -le 1048576
          file_mode=$(stat --format='%a' "$PHASE6_DEPLOYMENT_VALUES_PATH")
          test $((8#$file_mode & 8#22)) -eq 0
          node scripts/release/validate-phase-6-deployment-plan.mjs --validate-environment
          kubectl version --client --output=json > "$RUNNER_TEMP/kubectl-version.json"
          node --input-type=module --eval "import{readFileSync}from'node:fs';const v=JSON.parse(readFileSync(process.argv[1],'utf8')).clientVersion.gitVersion;if(v!==process.env.PHASE6_DEPLOYMENT_KUBECTL_VERSION)process.exit(1)" "$RUNNER_TEMP/kubectl-version.json"

      - name: 重新验收有效 Go-No-Go 原始证据
        run: >-
          node scripts/release/validate-phase-5-go-no-go-evidence.mjs
          --enforce-environment
          "$PHASE6_DEPLOYMENT_GO_NO_GO_PATH"
          > "$RUNNER_TEMP/go-no-go-verdict.json"

      - name: 重新验收生产平台准入证据
        run: >-
          node scripts/release/validate-phase-6-platform-intake.mjs
          --enforce-environment
          "$PHASE6_DEPLOYMENT_PLATFORM_INTAKE_PATH"
          > "$RUNNER_TEMP/platform-intake-verdict.json"

      - name: 渲染、校验并生成只读计划
        shell: bash
        run: |
          helm lint deploy/helm/gaoq-erp --strict \
            --values "$PHASE6_DEPLOYMENT_VALUES_PATH"
          helm template "$PHASE6_DEPLOYMENT_RELEASE_NAME" deploy/helm/gaoq-erp \
            --namespace "$PHASE6_DEPLOYMENT_CONTROL_NAMESPACE" \
            --values "$PHASE6_DEPLOYMENT_VALUES_PATH" \
            > "$RUNNER_TEMP/production-rendered.yaml"
          chmod 0600 "$RUNNER_TEMP/production-rendered.yaml"
          node scripts/validate-kubernetes-deployment.mjs \
            "$RUNNER_TEMP/production-rendered.yaml"
          node scripts/release/validate-phase-6-deployment-plan.mjs \
            --enforce-environment "$RUNNER_TEMP/production-rendered.yaml" \
            > "$RUNNER_TEMP/deployment-plan-verdict.json"
          kubeconform -strict -summary -kubernetes-version 1.30.0 \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/987aa4ee419358d6ae108f54f6c42f4e90f22b70/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}.json' \
            "$RUNNER_TEMP/production-rendered.yaml"
          kubectl get namespace "$PHASE6_DEPLOYMENT_CONTROL_NAMESPACE" > /dev/null
          kubectl get namespace "$PHASE6_DEPLOYMENT_TARGET_NAMESPACE" > /dev/null
          kubectl get configmap "$PHASE6_DEPLOYMENT_API_CONFIG_MAP" \
            --namespace "$PHASE6_DEPLOYMENT_TARGET_NAMESPACE" --output json \
            > "$RUNNER_TEMP/api-runtime-config.json"
          kubectl get configmap "$PHASE6_DEPLOYMENT_WORKER_CONFIG_MAP" \
            --namespace "$PHASE6_DEPLOYMENT_TARGET_NAMESPACE" --output json \
            > "$RUNNER_TEMP/worker-runtime-config.json"
          chmod 0600 "$RUNNER_TEMP/api-runtime-config.json" \
            "$RUNNER_TEMP/worker-runtime-config.json"
          node scripts/release/validate-phase-6-runtime-config.mjs \
            --enforce-environment \
            "$RUNNER_TEMP/api-runtime-config.json" \
            "$RUNNER_TEMP/worker-runtime-config.json" \
            > "$RUNNER_TEMP/runtime-config-verdict.json"
          kubectl get configmap "$PHASE6_DEPLOYMENT_WEB_CONFIG_MAP" \
            --namespace "$PHASE6_DEPLOYMENT_TARGET_NAMESPACE" > /dev/null
          kubectl get configmap "$PHASE6_DEPLOYMENT_WEBSITE_CONFIG_MAP" \
            --namespace "$PHASE6_DEPLOYMENT_TARGET_NAMESPACE" > /dev/null
          if kubectl auth can-i get secrets --namespace "$PHASE6_DEPLOYMENT_CONTROL_NAMESPACE"; then exit 1; fi
          if kubectl auth can-i get secrets --namespace "$PHASE6_DEPLOYMENT_TARGET_NAMESPACE"; then exit 1; fi
          if kubectl auth can-i create deployments --namespace "$PHASE6_DEPLOYMENT_TARGET_NAMESPACE"; then exit 1; fi
          if kubectl auth can-i patch deployments --namespace "$PHASE6_DEPLOYMENT_TARGET_NAMESPACE"; then exit 1; fi
          if kubectl auth can-i delete deployments --namespace "$PHASE6_DEPLOYMENT_TARGET_NAMESPACE"; then exit 1; fi
          if helm status "$PHASE6_DEPLOYMENT_RELEASE_NAME" \
            --namespace "$PHASE6_DEPLOYMENT_CONTROL_NAMESPACE" > /dev/null 2>&1; then
            helm get manifest "$PHASE6_DEPLOYMENT_RELEASE_NAME" \
              --namespace "$PHASE6_DEPLOYMENT_CONTROL_NAMESPACE" \
              > "$RUNNER_TEMP/current-manifest.yaml"
          else
            : > "$RUNNER_TEMP/current-manifest.yaml"
          fi
          set +e
          diff --unified "$RUNNER_TEMP/current-manifest.yaml" \
            "$RUNNER_TEMP/production-rendered.yaml" \
            > "$RUNNER_TEMP/deployment.diff"
          diff_status=$?
          set -e
          test "$diff_status" -le 1

      - name: 固定计划与审批源绑定
        run: >-
          node scripts/release/validate-phase-6-deployment-authorization.mjs
          --write-plan-binding
          "$RUNNER_TEMP/deployment-plan-binding.json"
          "$RUNNER_TEMP/production-rendered.yaml"

      - name: 保存待外部签名审批的计划
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-6-production-plan-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/go-no-go-verdict.json
            ${{ runner.temp }}/platform-intake-verdict.json
            ${{ runner.temp }}/deployment-plan-verdict.json
            ${{ runner.temp }}/runtime-config-verdict.json
            ${{ runner.temp }}/deployment-plan-binding.json
            ${{ runner.temp }}/production-rendered.yaml
            ${{ runner.temp }}/deployment.diff
          if-no-files-found: error
          retention-days: 90
