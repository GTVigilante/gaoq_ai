name: Phase 6 统一切换证据验收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-6-cutover-acceptance
  cancel-in-progress: false

jobs:
  contract:
    name: 校验统一切换契约
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 只允许默认分支执行最终验收
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: 检出代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 执行契约自测
        run: node scripts/release/validate-phase-6-cutover-evidence.mjs --self-test

  evidence:
    name: 验收生产统一切换证据
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GAOQ_OIDC_POLICY: phase-6-cutover-acceptance
      PHASE6_CUTOVER_EVIDENCE_OIDC_AUDIENCE: ${{ vars.PHASE6_CUTOVER_EVIDENCE_OIDC_AUDIENCE }}
      PHASE6_CUTOVER_EVIDENCE_URL: ${{ vars.PHASE6_CUTOVER_EVIDENCE_URL }}
      PHASE6_CUTOVER_EVIDENCE_SHA256: ${{ vars.PHASE6_CUTOVER_EVIDENCE_SHA256 }}
      PHASE6_CUTOVER_EXPECTED_ENVIRONMENT: ${{ vars.PHASE6_CUTOVER_ENVIRONMENT_NAME }}
      PHASE6_CUTOVER_EXPECTED_REGION: ${{ vars.PHASE6_CUTOVER_REGION }}
      PHASE6_CUTOVER_EXPECTED_COMMIT: ${{ github.sha }}
      PHASE6_CUTOVER_EXPECTED_API_IMAGE: ${{ vars.PHASE6_CUTOVER_API_IMAGE_DIGEST }}
      PHASE6_CUTOVER_EXPECTED_WORKER_IMAGE: ${{ vars.PHASE6_CUTOVER_WORKER_IMAGE_DIGEST }}
      PHASE6_CUTOVER_EXPECTED_WEB_IMAGE: ${{ vars.PHASE6_CUTOVER_WEB_IMAGE_DIGEST }}
      PHASE6_CUTOVER_EXPECTED_WEBSITE_IMAGE: ${{ vars.PHASE6_CUTOVER_WEBSITE_IMAGE_DIGEST }}
      PHASE6_CUTOVER_EXPECTED_DEPLOYMENT_MANIFEST: ${{ vars.PHASE6_CUTOVER_DEPLOYMENT_MANIFEST_SHA256 }}
      PHASE6_CUTOVER_SIGNER_KEYSET_SHA256: ${{ vars.PHASE6_CUTOVER_SIGNER_KEYSET_SHA256 }}
    steps:
      - name: 检出受信任代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 固定 Runner 临时证据路径
        shell: bash
        run: >-
          printf 'PHASE6_CUTOVER_EVIDENCE_PATH=%s\n'
          "$RUNNER_TEMP/phase-6-cutover.json"
          >> "$GITHUB_ENV"

      - name: 通过 GitHub OIDC 拉取脱敏统一切换证据
        run: >-
          node scripts/github/fetch-oidc-protected-input.mjs
          --url "$PHASE6_CUTOVER_EVIDENCE_URL"
          --audience "$PHASE6_CUTOVER_EVIDENCE_OIDC_AUDIENCE"
          --policy "$GAOQ_OIDC_POLICY"
          --output "$PHASE6_CUTOVER_EVIDENCE_PATH"
          --sha256 "$PHASE6_CUTOVER_EVIDENCE_SHA256"
          --max-bytes 1048576
          --media-type application/json

      - name: 验证版本绑定与生产切换证据
        env:
          PHASE6_CUTOVER_VERDICT_PATH: ${{ runner.temp }}/phase-6-cutover-verdict.json
        run: >-
          node scripts/release/validate-phase-6-cutover-evidence.mjs
          --enforce-environment
          "$PHASE6_CUTOVER_EVIDENCE_PATH"
          > "$PHASE6_CUTOVER_VERDICT_PATH"

      - name: 保存不触发部署的切换结论
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-6-cutover-verdict-${{ github.sha }}
          path: ${{ runner.temp }}/phase-6-cutover-verdict.json
          if-no-files-found: error
          retention-days: 90
