name: Phase 5 安全与供应链门禁

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '23 18 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-5-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: 依赖变更审查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.29.2

      - name: 安装 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: 从锁文件安装依赖
        run: pnpm install --frozen-lockfile

      - name: 阻断高危依赖
        run: pnpm audit --audit-level high

      - name: 阻断禁用或未识别许可证
        run: pnpm security:licenses

  sast:
    name: Bearer SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装校验过摘要的 Bearer 2.0.2
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/bearer.tar.gz" \
            https://github.com/Bearer/bearer/releases/download/v2.0.2/bearer_2.0.2_linux_amd64.tar.gz
          echo "865c80c5f80aaca1f83e98bca4decb0fd5b5d024e13f8ec48e94d69430d0d23b  $RUNNER_TEMP/bearer.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/bearer.tar.gz" --directory "$RUNNER_TEMP"

      - name: 阻断 High 与 Critical SAST 发现
        run: >-
          $RUNNER_TEMP/bearer scan .
          --severity critical,high
          --fail-on-severity critical,high
          --exit-code 1
          --ignore-file bearer.ignore
          --skip-path node_modules,.next,dist,coverage
          --disable-version-check
          --quiet
          --no-color

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出完整历史
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 安装校验过摘要的 Gitleaks 8.30.1
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks

      - name: 扫描提交历史中的密钥
        run: >-
          $RUNNER_TEMP/gitleaks git
          --config .gitleaks.toml
          --redact
          --no-banner
          --exit-code 1
          .

  supply-chain:
    name: SCA、SBOM 与仓库扫描
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.29.2

      - name: 安装 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: 从锁文件安装依赖
        run: pnpm install --frozen-lockfile

      - name: 阻断高危和严重依赖漏洞
        run: pnpm audit --audit-level high

      - name: 生成 SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: gaoq-os.spdx.json
          artifact-name: gaoq-os-sbom
          upload-artifact: true
          upload-artifact-retention: 30

      - name: 扫描依赖、密钥和错误配置
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          skip-dirs: node_modules,.next,dist,coverage
          timeout: 10m
