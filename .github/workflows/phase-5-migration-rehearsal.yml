name: Phase 5 全量迁移三次演练证据验收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-5-migration-rehearsal
  cancel-in-progress: false

jobs:
  contract:
    name: 校验受信任分支与迁移演练证据契约
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 只允许默认分支执行现场验收
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: 检出代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 校验全部 Scope 聚合证据的失败关闭边界
        run: node scripts/migration/validate-phase-5-migration-rehearsal-evidence.mjs --self-test

  evidence:
    name: 验收三轮全量迁移与故障演练聚合证据
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GAOQ_OIDC_POLICY: phase-5-migration-rehearsal
      MIGRATION_REHEARSAL_EVIDENCE_OIDC_AUDIENCE: ${{ vars.MIGRATION_REHEARSAL_EVIDENCE_OIDC_AUDIENCE }}
      MIGRATION_REHEARSAL_EVIDENCE_URL: ${{ vars.MIGRATION_REHEARSAL_EVIDENCE_URL }}
      MIGRATION_REHEARSAL_EVIDENCE_SHA256: ${{ vars.MIGRATION_REHEARSAL_EVIDENCE_SHA256 }}
      MIGRATION_REHEARSAL_EXPECTED_ENVIRONMENT: ${{ vars.MIGRATION_REHEARSAL_ENVIRONMENT_NAME }}
      MIGRATION_REHEARSAL_EXPECTED_REGION: ${{ vars.MIGRATION_REHEARSAL_REGION }}
      MIGRATION_REHEARSAL_EXPECTED_COMMIT: ${{ github.sha }}
      MIGRATION_REHEARSAL_EXPECTED_API_IMAGE: ${{ vars.MIGRATION_REHEARSAL_API_IMAGE_DIGEST }}
      MIGRATION_REHEARSAL_EXPECTED_WORKER_IMAGE: ${{ vars.MIGRATION_REHEARSAL_WORKER_IMAGE_DIGEST }}
      MIGRATION_REHEARSAL_EXPECTED_WEB_IMAGE: ${{ vars.MIGRATION_REHEARSAL_WEB_IMAGE_DIGEST }}
      MIGRATION_REHEARSAL_EXPECTED_WEBSITE_IMAGE: ${{ vars.MIGRATION_REHEARSAL_WEBSITE_IMAGE_DIGEST }}
      MIGRATION_REHEARSAL_EXPECTED_DEPLOYMENT_MANIFEST: ${{ vars.MIGRATION_REHEARSAL_DEPLOYMENT_MANIFEST_SHA256 }}
      MIGRATION_REHEARSAL_EXPECTED_SOURCE_SNAPSHOT: ${{ vars.MIGRATION_REHEARSAL_SOURCE_SNAPSHOT_SHA256 }}
      MIGRATION_REHEARSAL_EXPECTED_PACKAGE_MANIFEST: ${{ vars.MIGRATION_REHEARSAL_PACKAGE_MANIFEST_SHA256 }}
      MIGRATION_REHEARSAL_EXPECTED_SIGNER_KEYSET_SHA256: ${{ vars.MIGRATION_REHEARSAL_SIGNER_KEYSET_SHA256 }}
    steps:
      - name: 检出受信任代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 固定 Runner 临时证据路径
        shell: bash
        run: >-
          printf 'MIGRATION_REHEARSAL_EVIDENCE_PATH=%s\n'
          "$RUNNER_TEMP/phase-5-migration-rehearsal.json"
          >> "$GITHUB_ENV"

      - name: 通过 GitHub OIDC 拉取脱敏迁移聚合证据
        run: >-
          node scripts/github/fetch-oidc-protected-input.mjs
          --url "$MIGRATION_REHEARSAL_EVIDENCE_URL"
          --audience "$MIGRATION_REHEARSAL_EVIDENCE_OIDC_AUDIENCE"
          --policy "$GAOQ_OIDC_POLICY"
          --output "$MIGRATION_REHEARSAL_EVIDENCE_PATH"
          --sha256 "$MIGRATION_REHEARSAL_EVIDENCE_SHA256"
          --max-bytes 1048576
          --media-type application/json

      - name: 验证版本绑定与三轮全量迁移聚合证据
        env:
          MIGRATION_REHEARSAL_VERDICT_PATH: ${{ runner.temp }}/phase-5-migration-rehearsal-verdict.json
        run: >-
          node scripts/migration/validate-phase-5-migration-rehearsal-evidence.mjs
          --enforce-environment
          "$MIGRATION_REHEARSAL_EVIDENCE_PATH"
          > "$MIGRATION_REHEARSAL_VERDICT_PATH"

      - name: 保存不含业务数据的验收结论
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-5-migration-rehearsal-verdict-${{ github.sha }}
          path: ${{ runner.temp }}/phase-5-migration-rehearsal-verdict.json
          if-no-files-found: error
          retention-days: 30
