name: Phase 5 七类发布就绪证据验收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-5-readiness
  cancel-in-progress: false

jobs:
  contract:
    name: 校验七类独立 verdict 契约
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 只允许默认分支执行现场验收
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: 校验就绪证据失败关闭边界
        run: node scripts/release/validate-phase-5-readiness-evidence.mjs --self-test

  evidence:
    name: 验收工程、供应链、镜像、权限、UAT、隐私与运行证据
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GAOQ_OIDC_POLICY: phase-5-readiness
      READINESS_EVIDENCE_OIDC_AUDIENCE: ${{ vars.READINESS_EVIDENCE_OIDC_AUDIENCE }}
      READINESS_EVIDENCE_URL: ${{ vars.READINESS_EVIDENCE_URL }}
      READINESS_EVIDENCE_SHA256: ${{ vars.READINESS_EVIDENCE_SHA256 }}
      READINESS_EXPECTED_ENVIRONMENT: ${{ vars.READINESS_ENVIRONMENT_NAME }}
      READINESS_EXPECTED_REGION: ${{ vars.READINESS_REGION }}
      READINESS_EXPECTED_COMMIT: ${{ github.sha }}
      READINESS_EXPECTED_API_IMAGE: ${{ vars.READINESS_API_IMAGE_DIGEST }}
      READINESS_EXPECTED_WORKER_IMAGE: ${{ vars.READINESS_WORKER_IMAGE_DIGEST }}
      READINESS_EXPECTED_WEB_IMAGE: ${{ vars.READINESS_WEB_IMAGE_DIGEST }}
      READINESS_EXPECTED_WEBSITE_IMAGE: ${{ vars.READINESS_WEBSITE_IMAGE_DIGEST }}
      READINESS_EXPECTED_DEPLOYMENT_MANIFEST: ${{ vars.READINESS_DEPLOYMENT_MANIFEST_SHA256 }}
      READINESS_EXPECTED_SIGNER_KEYSET_SHA256: ${{ vars.READINESS_SIGNER_KEYSET_SHA256 }}
    steps:
      - name: 检出受信任代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: 固定 Runner 临时证据路径
        shell: bash
        run: >-
          printf 'READINESS_EVIDENCE_PATH=%s\n'
          "$RUNNER_TEMP/phase-5-readiness.json"
          >> "$GITHUB_ENV"

      - name: 通过 GitHub OIDC 拉取脱敏发布就绪证据
        run: >-
          node scripts/github/fetch-oidc-protected-input.mjs
          --url "$READINESS_EVIDENCE_URL"
          --audience "$READINESS_EVIDENCE_OIDC_AUDIENCE"
          --policy "$GAOQ_OIDC_POLICY"
          --output "$READINESS_EVIDENCE_PATH"
          --sha256 "$READINESS_EVIDENCE_SHA256"
          --max-bytes 1048576
          --media-type application/json

      - name: 验证版本绑定并生成七类独立 verdict
        env:
          READINESS_VERDICT_PATH: ${{ runner.temp }}/phase-5-readiness-verdicts.json
        run: >-
          node scripts/release/validate-phase-5-readiness-evidence.mjs
          --enforce-environment
          "$READINESS_EVIDENCE_PATH"
          > "$READINESS_VERDICT_PATH"

      - name: 保存不含业务数据的 verdict bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-5-readiness-verdicts-${{ github.sha }}
          path: ${{ runner.temp }}/phase-5-readiness-verdicts.json
          if-no-files-found: error
          retention-days: 30
