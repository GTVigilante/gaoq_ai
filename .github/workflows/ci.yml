name: 专业算薪质量与供应链门禁

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: payroll-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 代码、契约与依赖
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.29.2
      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: 执行冻结安装、审计和完整门禁
        run: |
          pnpm install --frozen-lockfile
          pnpm audit
          pnpm check
          pnpm deployment:production:validate

  container-images:
    name: 生产镜像（${{ matrix.image }}）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            target: payroll-api
          - image: worker
            target: payroll-worker
          - image: web
            target: payroll-web
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 构建不可变生产镜像
        run: |
          docker build \
            --target "${{ matrix.target }}" \
            --build-arg IMAGE_REVISION="$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_PAYROLL_ORIGIN=https://payroll.example.invalid \
            --tag "gaoq-payroll/${{ matrix.image }}:$GITHUB_SHA" \
            .
      - name: 验证非 root 与健康检查
        run: |
          image="gaoq-payroll/${{ matrix.image }}:$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect "$image" --format '{{json .Config.Healthcheck.Test}}')" != 'null'
      - name: 生成 SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: gaoq-payroll/${{ matrix.image }}:${{ github.sha }}
          artifact-name: gaoq-payroll-${{ matrix.image }}-sbom
          upload-artifact: true
          upload-artifact-retention: 30
      - name: 阻断 High/Critical 漏洞
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gaoq-payroll/${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: false
          severity: HIGH,CRITICAL
