name: Phase 6 稳定期与归档证据验收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-6-hypercare-acceptance
  cancel-in-progress: false

jobs:
  contract:
    name: 校验稳定期与归档契约
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 只允许默认分支执行最终验收
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: 检出代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: 执行契约自测
        run: node scripts/release/validate-phase-6-hypercare-evidence.mjs --self-test

  evidence:
    name: 验收二十八天生产稳定期与归档证据
    needs: contract
    runs-on:
      - self-hosted
      - linux
      - x64
      - phase-6-hypercare
    timeout-minutes: 30
    environment: phase-6-hypercare-acceptance
    env:
      PHASE6_HYPERCARE_EVIDENCE_PATH: /var/lib/gaoq/phase-6/hypercare.json
      PHASE6_HYPERCARE_EXPECTED_ENVIRONMENT: ${{ vars.PHASE6_HYPERCARE_ENVIRONMENT_NAME }}
      PHASE6_HYPERCARE_EXPECTED_REGION: ${{ vars.PHASE6_HYPERCARE_REGION }}
      PHASE6_HYPERCARE_EXPECTED_COMMIT: ${{ github.sha }}
      PHASE6_HYPERCARE_EXPECTED_RELEASE: ${{ vars.PHASE6_HYPERCARE_RELEASE_CANDIDATE }}
      PHASE6_HYPERCARE_EXPECTED_CUTOVER_EVIDENCE: ${{ vars.PHASE6_HYPERCARE_CUTOVER_EVIDENCE_SHA256 }}
      PHASE6_HYPERCARE_VERDICT_PATH: ${{ runner.temp }}/phase-6-hypercare-verdict.json
    steps:
      - name: 检出受信任代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: 验证稳定期连续性与归档批准
        run: >-
          node scripts/release/validate-phase-6-hypercare-evidence.mjs
          --enforce-environment
          "$PHASE6_HYPERCARE_EVIDENCE_PATH"
          > "$PHASE6_HYPERCARE_VERDICT_PATH"

      - name: 保存不触发删除的归档结论
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-6-hypercare-verdict-${{ github.sha }}
          path: ${{ runner.temp }}/phase-6-hypercare-verdict.json
          if-no-files-found: error
          retention-days: 90
