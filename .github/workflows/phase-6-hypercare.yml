name: Phase 6 稳定期与归档证据验收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-6-hypercare-acceptance
  cancel-in-progress: false

jobs:
  contract:
    name: 校验稳定期与归档契约
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 只允许默认分支执行最终验收
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 执行契约自测
        run: node scripts/release/validate-phase-6-hypercare-evidence.mjs --self-test

  evidence:
    name: 验收二十八天生产稳定期与归档证据
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GAOQ_OIDC_POLICY: phase-6-hypercare-acceptance
      PHASE6_HYPERCARE_EVIDENCE_OIDC_AUDIENCE: ${{ vars.PHASE6_HYPERCARE_EVIDENCE_OIDC_AUDIENCE }}
      PHASE6_HYPERCARE_EVIDENCE_URL: ${{ vars.PHASE6_HYPERCARE_EVIDENCE_URL }}
      PHASE6_HYPERCARE_EVIDENCE_SHA256: ${{ vars.PHASE6_HYPERCARE_EVIDENCE_SHA256 }}
      PHASE6_HYPERCARE_EXPECTED_ENVIRONMENT: ${{ vars.PHASE6_HYPERCARE_ENVIRONMENT_NAME }}
      PHASE6_HYPERCARE_EXPECTED_REGION: ${{ vars.PHASE6_HYPERCARE_REGION }}
      PHASE6_HYPERCARE_EXPECTED_COMMIT: ${{ github.sha }}
      PHASE6_HYPERCARE_EXPECTED_RELEASE: ${{ vars.PHASE6_HYPERCARE_RELEASE_CANDIDATE }}
      PHASE6_HYPERCARE_EXPECTED_CUTOVER_EVIDENCE: ${{ vars.PHASE6_HYPERCARE_CUTOVER_EVIDENCE_SHA256 }}
      PHASE6_HYPERCARE_SIGNER_KEYSET_SHA256: ${{ vars.PHASE6_HYPERCARE_SIGNER_KEYSET_SHA256 }}
    steps:
      - name: 检出受信任代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 固定 Runner 临时证据路径
        shell: bash
        run: >-
          printf 'PHASE6_HYPERCARE_EVIDENCE_PATH=%s\n'
          "$RUNNER_TEMP/phase-6-hypercare.json"
          >> "$GITHUB_ENV"

      - name: 通过 GitHub OIDC 拉取脱敏稳定期证据
        run: >-
          node scripts/github/fetch-oidc-protected-input.mjs
          --url "$PHASE6_HYPERCARE_EVIDENCE_URL"
          --audience "$PHASE6_HYPERCARE_EVIDENCE_OIDC_AUDIENCE"
          --policy "$GAOQ_OIDC_POLICY"
          --output "$PHASE6_HYPERCARE_EVIDENCE_PATH"
          --sha256 "$PHASE6_HYPERCARE_EVIDENCE_SHA256"
          --max-bytes 1048576
          --media-type application/json

      - name: 验证稳定期连续性与归档批准
        env:
          PHASE6_HYPERCARE_VERDICT_PATH: ${{ runner.temp }}/phase-6-hypercare-verdict.json
        run: >-
          node scripts/release/validate-phase-6-hypercare-evidence.mjs
          --enforce-environment
          "$PHASE6_HYPERCARE_EVIDENCE_PATH"
          > "$PHASE6_HYPERCARE_VERDICT_PATH"

      - name: 保存不触发删除的归档结论
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-6-hypercare-verdict-${{ github.sha }}
          path: ${{ runner.temp }}/phase-6-hypercare-verdict.json
          if-no-files-found: error
          retention-days: 90
