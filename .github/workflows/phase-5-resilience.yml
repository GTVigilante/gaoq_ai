name: Phase 5 容灾与断连证据验收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-5-resilience
  cancel-in-progress: false

jobs:
  contract:
    name: 校验受信任分支与证据契约
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 只允许默认分支执行现场验收
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: 检出代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: 校验证据契约的失败关闭边界
        run: node scripts/resilience/validate-phase-5-resilience-evidence.mjs --self-test

  evidence:
    name: 验收隔离恢复环境证据
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GAOQ_OIDC_POLICY: phase-5-resilience
      RESILIENCE_EVIDENCE_OIDC_AUDIENCE: ${{ vars.RESILIENCE_EVIDENCE_OIDC_AUDIENCE }}
      RESILIENCE_EVIDENCE_URL: ${{ vars.RESILIENCE_EVIDENCE_URL }}
      RESILIENCE_EVIDENCE_SHA256: ${{ vars.RESILIENCE_EVIDENCE_SHA256 }}
      RESILIENCE_EXPECTED_ENVIRONMENT: ${{ vars.RESILIENCE_ENVIRONMENT_NAME }}
      RESILIENCE_EXPECTED_REGION: ${{ vars.RESILIENCE_REGION }}
      RESILIENCE_EXPECTED_COMMIT: ${{ github.sha }}
      RESILIENCE_EXPECTED_API_IMAGE: ${{ vars.RESILIENCE_API_IMAGE_DIGEST }}
      RESILIENCE_EXPECTED_WORKER_IMAGE: ${{ vars.RESILIENCE_WORKER_IMAGE_DIGEST }}
      RESILIENCE_EXPECTED_WEB_IMAGE: ${{ vars.RESILIENCE_WEB_IMAGE_DIGEST }}
      RESILIENCE_EXPECTED_WEBSITE_IMAGE: ${{ vars.RESILIENCE_WEBSITE_IMAGE_DIGEST }}
      RESILIENCE_EXPECTED_PAYROLL_IMAGE: ${{ vars.RESILIENCE_PAYROLL_IMAGE_DIGEST }}
      RESILIENCE_EXPECTED_DEPLOYMENT_MANIFEST: ${{ vars.RESILIENCE_DEPLOYMENT_MANIFEST_SHA256 }}
    steps:
      - name: 检出受信任代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: 固定 Runner 临时证据路径
        shell: bash
        run: >-
          printf 'RESILIENCE_EVIDENCE_PATH=%s\n'
          "$RUNNER_TEMP/phase-5-resilience.json"
          >> "$GITHUB_ENV"

      - name: 通过 GitHub OIDC 拉取脱敏容灾证据
        run: >-
          node scripts/github/fetch-oidc-protected-input.mjs
          --url "$RESILIENCE_EVIDENCE_URL"
          --audience "$RESILIENCE_EVIDENCE_OIDC_AUDIENCE"
          --policy "$GAOQ_OIDC_POLICY"
          --output "$RESILIENCE_EVIDENCE_PATH"
          --sha256 "$RESILIENCE_EVIDENCE_SHA256"
          --max-bytes 524288
          --media-type application/json

      - name: 验证环境绑定与完整演练证据
        env:
          RESILIENCE_VERDICT_PATH: ${{ runner.temp }}/phase-5-resilience-verdict.json
        run: >-
          node scripts/resilience/validate-phase-5-resilience-evidence.mjs
          --enforce-environment
          "$RESILIENCE_EVIDENCE_PATH"
          > "$RESILIENCE_VERDICT_PATH"

      - name: 保存不含业务数据的验收结论
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-5-resilience-verdict-${{ github.sha }}
          path: ${{ runner.temp }}/phase-5-resilience-verdict.json
          if-no-files-found: error
          retention-days: 30
