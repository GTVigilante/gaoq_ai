name: Phase 5 容灾与断连证据验收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-5-resilience
  cancel-in-progress: false

jobs:
  contract:
    name: 校验受信任分支与证据契约
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 只允许默认分支执行现场验收
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: 检出代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: 校验证据契约的失败关闭边界
        run: node scripts/resilience/validate-phase-5-resilience-evidence.mjs --self-test

  evidence:
    name: 验收隔离恢复环境证据
    needs: contract
    runs-on:
      - self-hosted
      - linux
      - x64
      - phase-5-resilience
    timeout-minutes: 30
    environment: phase-5-resilience
    env:
      RESILIENCE_EVIDENCE_PATH: /var/lib/gaoq/resilience/phase-5-resilience.json
      RESILIENCE_EXPECTED_ENVIRONMENT: ${{ vars.RESILIENCE_ENVIRONMENT_NAME }}
      RESILIENCE_EXPECTED_REGION: ${{ vars.RESILIENCE_REGION }}
      RESILIENCE_EXPECTED_COMMIT: ${{ github.sha }}
      RESILIENCE_EXPECTED_API_IMAGE: ${{ vars.RESILIENCE_API_IMAGE_DIGEST }}
      RESILIENCE_EXPECTED_WORKER_IMAGE: ${{ vars.RESILIENCE_WORKER_IMAGE_DIGEST }}
      RESILIENCE_EXPECTED_WEB_IMAGE: ${{ vars.RESILIENCE_WEB_IMAGE_DIGEST }}
      RESILIENCE_EXPECTED_DEPLOYMENT_MANIFEST: ${{ vars.RESILIENCE_DEPLOYMENT_MANIFEST_SHA256 }}
      RESILIENCE_VERDICT_PATH: ${{ runner.temp }}/phase-5-resilience-verdict.json
    steps:
      - name: 检出受信任代码
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: 验证环境绑定与完整演练证据
        run: >-
          node scripts/resilience/validate-phase-5-resilience-evidence.mjs
          --enforce-environment
          "$RESILIENCE_EVIDENCE_PATH"
          > "$RESILIENCE_VERDICT_PATH"

      - name: 保存不含业务数据的验收结论
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-5-resilience-verdict-${{ github.sha }}
          path: ${{ runner.temp }}/phase-5-resilience-verdict.json
          if-no-files-found: error
          retention-days: 30
