name: Phase 1 工程质量门禁

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.github/workflows/**'
      - 'scripts/**'
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.github/workflows/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: phase-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 检查、测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.29.2

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 执行工程门禁
        run: pnpm check

      - name: 构建工作区
        env:
          NEXT_PUBLIC_WEBSITE_ORIGIN: https://www.example.invalid
          NEXT_PUBLIC_ERP_API_ORIGIN: https://erp.example.invalid
          NEXT_PUBLIC_MARKETING_CAPTCHA_WIDGET_ORIGIN: https://captcha.example.invalid
          NEXT_PUBLIC_MARKETING_CAPTCHA_WIDGET_URL: https://captcha.example.invalid/widget
        run: pnpm build

      - name: 生成临时运行凭据
        shell: bash
        run: |
          {
            printf 'DEV_OBJECT_STORAGE_ACCESS_KEY=gaoq%s\n' "$(openssl rand -hex 10)"
            printf 'DEV_OBJECT_STORAGE_SECRET_KEY=%s\n' "$(openssl rand -base64 32 | tr -d '\n')"
            printf 'DEV_OBJECT_STORAGE_BUCKET=gaoq-ci\n'
            printf 'MONGO_PORT=27020\n'
            printf 'REDIS_PORT=6391\n'
          } >> "$GITHUB_ENV"

      - name: 启动临时 MongoDB Replica Set 与 Redis
        run: |
          docker compose up -d --wait mongo redis
          docker compose run --rm --no-deps mongo-init
          for _ in {1..30}; do
            if docker compose exec -T mongo mongosh --quiet --eval \
              'if (!db.hello().isWritablePrimary) quit(1)'; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: 验证真实 Worker、OAuth 与标准 MCP 运行时
        run: pnpm smoke:runtime:live

      - name: 输出运行时故障诊断
        if: failure()
        run: docker compose logs --no-color --tail 100 mongo redis

      - name: 清理临时运行时
        if: always()
        run: docker compose down --volumes --remove-orphans
