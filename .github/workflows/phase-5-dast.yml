name: Phase 5 DAST 主动扫描

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-5-dast
  cancel-in-progress: false

jobs:
  active-scan:
    name: 生产等价隔离环境 DAST
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    env:
      GAOQ_OIDC_POLICY: phase-5-dast
      DAST_CONFIG_OIDC_AUDIENCE: ${{ vars.DAST_CONFIG_OIDC_AUDIENCE }}
      DAST_CONFIG_URL: ${{ vars.DAST_CONFIG_URL }}
      DAST_CONFIG_SHA256: ${{ vars.DAST_CONFIG_SHA256 }}
      DAST_ENVIRONMENT_NAME: ${{ vars.DAST_ENVIRONMENT_NAME }}
      DAST_ALLOWED_HOST_SUFFIX: ${{ vars.DAST_ALLOWED_HOST_SUFFIX }}
      DAST_PRODUCTION_EQUIVALENT: ${{ vars.DAST_PRODUCTION_EQUIVALENT }}
      DAST_PRODUCTION_TRAFFIC: ${{ vars.DAST_PRODUCTION_TRAFFIC }}
      DAST_ACTIVE_SCAN_APPROVED: ${{ vars.DAST_ACTIVE_SCAN_APPROVED }}
    steps:
      - name: 只允许默认分支执行主动扫描
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: 检出受信任代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装固定 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1

      - name: 验证目标、密钥边界与工作流
        run: node scripts/security/run-phase-5-dast.mjs --self-test

      - name: 固定并拉取短期 DAST 配置
        shell: bash
        run: |
          printf 'DAST_CONFIG_PATH=%s\n' \
            "$RUNNER_TEMP/phase-5-dast-config.json" >> "$GITHUB_ENV"
          node scripts/github/fetch-oidc-protected-input.mjs \
            --url "$DAST_CONFIG_URL" \
            --audience "$DAST_CONFIG_OIDC_AUDIENCE" \
            --policy "$GAOQ_OIDC_POLICY" \
            --output "$RUNNER_TEMP/phase-5-dast-config.json" \
            --sha256 "$DAST_CONFIG_SHA256" \
            --max-bytes 16384 \
            --media-type application/json

      - name: 拉取固定摘要的 ZAP 2.17.0
        run: >-
          docker pull
          zaproxy/zap-stable@sha256:c558ee87358911ab17278c70991e856f57793e115d9cd0f88ca475cf82907a1a

      - name: 执行未认证与低权限主动扫描
        id: dast
        env:
          DAST_REPORT_DIR: ${{ runner.temp }}/phase-5-dast
        run: node scripts/security/run-phase-5-dast.mjs --run "$DAST_CONFIG_PATH"

      - name: 保存受控 DAST 原始报告
        if: always() && steps.dast.outputs.reports_safe == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-5-dast-${{ github.sha }}
          path: ${{ runner.temp }}/phase-5-dast
          if-no-files-found: error
          retention-days: 14
