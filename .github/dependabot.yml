version: 2

# 仓库治理要求远端只保留 main；保留更新清单用于审计，但禁止机器人创建更新分支。
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "01:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    labels:
      - type:task
      - domain:security
    commit-message:
      prefix: "[镜像] 升级"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "01:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    labels:
      - type:task
      - domain:security
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "[依赖] 升级"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    labels:
      - type:task
      - domain:devops
    commit-message:
      prefix: "[CI] 升级"
